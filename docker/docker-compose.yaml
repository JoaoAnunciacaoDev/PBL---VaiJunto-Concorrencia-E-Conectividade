services:
  server:
    image: vaijunto:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["/app/bin/api-server", "-data-dir", "/app/storage/data"]
    ports:
      - "${VAIJUNTO_HOST_PORT:-8080}:8080"
    volumes:
      - vaijunto-storage:/app/storage
    healthcheck:
      # Confere o socket em escuta sem abrir conexões artificiais que
      # apareceriam como sessões de clientes nos logs do servidor.
      test: ["CMD-SHELL", "netstat -ltn | grep -q ':8080 '"]
      interval: 2s
      timeout: 1s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  # Um único cliente permite cadastrar e usar os perfis de motorista e
  # passageiro. Execute com: docker compose run --rm client
  client:
    image: vaijunto:local
    command: ["/app/bin/api-client", "-addr=${VAIJUNTO_SERVER_ADDR:-server:8080}"]
    stdin_open: true
    tty: true

  seed:
    image: vaijunto:local
    command: ["/app/bin/seed", "-addr=server:8080"]
    depends_on:
      server:
        condition: service_healthy

volumes:
  vaijunto-storage:
